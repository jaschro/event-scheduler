name: Collect events

on:
  schedule:
    # Monday and Thursday. Cron is UTC: 11:00 UTC = 6 AM EST (winter) / 7 AM EDT (summer).
    - cron: "0 11 * * 1,4"
  workflow_dispatch:

# Minimum permissions (SPEC.md sections 2 and 8). No PAT needed.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      has_site: ${{ steps.site.outputs.has_site }}
      all_failed: ${{ steps.collect.outputs.all_failed }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Adapter tests
        run: python -m pytest -q collector/tests

      - name: Collect
        id: collect
        env:
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
        # Exit 1 means every source failed. Still commit and publish, so the failures show in
        # the page footer; the "report" job then marks the run as failed.
        run: python -m collector.main || echo "all_failed=true" >> "$GITHUB_OUTPUT"

      - name: Commit data if it changed
        run: |
          if git diff --quiet -- data/events.json data/status.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/status.json
          git commit -m "Update events data"
          git push

      - name: Check for site
        id: site
        run: |
          if [ -f site/index.html ]; then echo "has_site=true" >> "$GITHUB_OUTPUT"; else echo "has_site=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build Pages bundle
        if: steps.site.outputs.has_site == 'true'
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp data/events.json data/status.json _site/data/

      - name: Upload Pages artifact
        if: steps.site.outputs.has_site == 'true'
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: _site

  deploy:
    needs: collect
    if: needs.collect.outputs.has_site == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5

  report:
    needs: [collect, deploy]
    if: always() && needs.collect.outputs.all_failed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Fail because every source failed
        run: |
          echo "::error::Every source failed; see data/status.json or the page footer"
          exit 1
