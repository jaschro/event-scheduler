    page: https://events.miamibeachfl.gov/arts-and-culture/
    aggregator: true
    priority: 0   # lowest priority in dedupe

  - key: refresh-miami
    name: Refresh Miami
    city: miami
    kind: tech
    method: ics
    url: "webcal://refreshmiami.com/?post_type=tribe_events&ical=1&eventDisplay=list"
    page: https://refreshmiami.com/events/
    aggregator: true
    priority: 10

  - key: luma-miami
    name: Luma Miami
    city: miami
