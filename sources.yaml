  # ---------- NYC: Ticketmaster Discovery API ----------
  - key: ticketmaster-nyc
    name: Ticketmaster (New York)
    city: nyc
    kind: music
    method: ticketmaster
    aggregator: true
    priority: 5
    page: https://www.ticketmaster.com/discover/new-york
    params:
      latlong: "40.7549,-73.9840"   # Manhattan and nearby Brooklyn/Queens
      radius: 6
      venues:                       # only events at hosts on the NYC list (nyc_sources.yaml)
        - "92nd street y|\\b92ny\\b|92nd st"
        - "paley center"
        - "asia society"
        - "brooklyn museum"
        - "metropolitan museum|\\bthe met\\b|museum of modern art|\\bmoma\\b"
        - "new york public library|\\bnypl\\b|schwarzman"
        - "museum of jewish heritage|center for jewish history|\\byivo\\b"
        - "skyscraper museum|storefront for art|van alen|center for architecture"
        - "cooper union|the new school|parsons|columbia university|nyu\\b|cuny|graduate center"
        - "council on foreign relations|carnegie council|economic club"
    filter:
      exclude:
        - "(?i)\\bparking\\b"
        - "(?i)\\b(gift card|voucher|upgrade|add-on)\\b"
