    reader: simpleview
    page: https://www.miamiandbeaches.com/thing-to-do/arts-culture/adrienne-arsht-center-for-the-performing-arts-of-miami-dade-county/3269
    location: "Adrienne Arsht Center, 1300 Biscayne Blvd, Miami"

  # Ticketmaster Discovery API (TICKETMASTER_API_KEY secret). Aggregator: venue listings win in dedupe.
  - key: ticketmaster-miami
    name: Ticketmaster (Miami area)
    city: miami
    kind: music             # default; each event gets its own kind and venue from Ticketmaster
    method: ticketmaster
    aggregator: true
    priority: 5
    page: https://www.ticketmaster.com/discover/miami
    params:
      latlong: "25.7900,-80.2000"   # Miami, Miami Beach, Coral Gables
      radius: 12
      venues:                       # only events at hosts we follow (regex on Ticketmaster's venue name)
        - "arsht|knight concert hall|ziff ballet|carnival studio"
        - "bandshell"
        - "new world center|new world symphony"
        - "colony theat"
        - "gables art cinema|o cinema"
        - "p[eé]rez art museum|\\bpamm\\b"
        - "frost (museum|science)|the bass\\b|institute of contemporary art|\\bica miami"
        - "wolfsonian|rubell|oolite|books (&|and) books"
        - "miami beach (jcc|botanical)|jewish museum of florida"
    filter:
      exclude:
        - "(?i)\\bparking\\b"
        - "(?i)\\b(gift card|voucher|upgrade|add-on)\\b"

