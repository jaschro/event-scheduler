    method: ics
    url: "https://api.luma.com/ics/get?entity=discover&id=discplace-fSrrRYurTwydAGK"
    page: https://luma.com/miami
    aggregator: true
    priority: 5
    filter:
      # "filter hard": drop obvious noise from a high-volume city feed. Tune after first runs.
      exclude:
        - "(?i)\\b(webinar|virtual|online only|zoom)\\b"
        - "(?i)\\b(speed dating|singles)\\b"

