# Event Scheduler sources. See SPEC.md sections 2-3.
#
# cities: one block per city. Adding a city = add a block here plus its venues below.
# sources: one entry per venue / feed.
#   key        stable id, used as `source` in events.json (never rename once live)
#   name       display name shown on the page as the venue
#   city       key from the cities block
#   kind       tech, museum, art, film, stage, music, talks, science,
#              food and wine, wellness, community, outdoors
#   method     ics | eventbrite | (later: tribe | jsonld | custom | browser)
#   url        feed URL (ics) ; organizer_id for eventbrite
#   aggregator true for sites that list other venues' events (lose in dedupe)
#   priority   dedupe tie-break, higher wins (default 50, aggregators 10)
#   enabled    false = not collected yet (adapter is a later build step)
#   filter     optional {include: [regex...], exclude: [regex...]} on title+description
#   location   optional default location when the feed gives none
#   page       human page for the venue (fallback event link)

settings:
  days_ahead: 14
  user_agent: "EventSchedulerBot/0.1 (+https://github.com/jaschro/event-scheduler; personal, non-commercial)"
  request_delay_seconds: 1.0     # per host
  request_timeout_seconds: 30
  source_timeout_seconds: 120    # whole source, all pages
  default_duration_hours: 2      # used only for "has it ended?" when an event has no end

cities:
  - key: miami
    name: Miami
    tz: America/New_York
  # - key: nyc
  #   name: New York
  #   tz: America/New_York

sources:
  # ---------- Step 1: feeds ----------
  - key: miamibeach-arts
    name: City of Miami Beach Arts Calendar
    city: miami
    kind: art
    method: ics
    url: "webcal://events.miamibeachfl.gov/?post_type=tribe_events&ical=1&eventDisplay=list&tribe_events_cat=mbartsculture"
    page: https://events.miamibeachfl.gov/arts-and-culture/
    aggregator: true
    priority: 0   # lowest priority in dedupe

  - key: refresh-miami
    name: Refresh Miami
    city: miami
    kind: tech
    method: ics
    url: https://refreshmiami.com/events/?ical=1   # TODO(verify): standard The Events Calendar iCal export
    page: https://refreshmiami.com/events/
    aggregator: true
    priority: 10

  - key: luma-miami
    name: Luma Miami
    city: miami
    kind: community
    method: ics
    url: null   # TODO(Jason): city discovery page may have no feed; paste one here if luma.com/miami offers it
    page: https://luma.com/miami
    aggregator: true
    priority: 5
    filter:
      # "filter hard": drop obvious noise from a high-volume city feed. Tune after first runs.
      exclude:
        - "(?i)\\b(webinar|virtual|online only|zoom)\\b"
        - "(?i)\\b(speed dating|singles)\\b"

  - key: manatech
    name: ManaTech
    city: miami
    kind: tech
    method: ics
    url: null   # TODO(Jason): luma.com/manatech -> "Add iCal Subscription" -> copy link
    page: https://luma.com/manatech

  - key: hello-miami
    name: Hello Miami
    city: miami
    kind: tech
    method: ics
    url: null   # TODO(Jason): luma.com/hello_miami -> "Add iCal Subscription" -> copy link
    page: https://luma.com/hello_miami

  - key: miami-ai-hub
    name: Miami AI Hub
    city: miami
    kind: tech
    method: ics
    url: null   # TODO(Jason): luma.com/miamiaihub -> "Add iCal Subscription" -> copy link
    page: https://luma.com/miamiaihub

  - key: el-carajo
    name: El Carajo
    city: miami
    kind: food and wine
    method: eventbrite
    organizer_id: "40632499343"
    page: https://www.eventbrite.com/o/40632499343

  - key: 840-miami
    name: 840 Miami
    city: miami
    kind: wellness
    method: eventbrite
    organizer_id: "16691144833"
    page: https://www.eventbrite.com/o/16691144833

  - key: healthyme-love
    name: Healthyme.Love
    city: miami
    kind: wellness
    method: eventbrite
    organizer_id: "27397413755"
    page: https://www.eventbrite.com/o/27397413755

  - key: um-rosenstiel
    name: UM Rosenstiel (Johnson Center)
    city: miami
    kind: science
    method: eventbrite
    organizer_id: "121856689354"
    page: https://www.eventbrite.com/o/121856689354
    location: Key Biscayne

  # ---------- Later steps (step 4): not collected yet ----------
  - {key: venture-cafe, name: Venture Café Miami, city: miami, kind: tech, method: custom, enabled: false, page: "https://venturecafemiami.org"}
